    <path d="M-22-18 0 0" fill="none" stroke="#ffe7a0" stroke-linecap="round" stroke-width="3" opacity=".7"/>
    <path d="m0-11 3.2 7.8 8.3.7-6.3 5.3 2 8-7.2-4.3-7.1 4.3 1.9-8-6.2-5.3 8.2-.7z" fill="#fff4bd" stroke="#ffd878" stroke-width="1.5"/>
