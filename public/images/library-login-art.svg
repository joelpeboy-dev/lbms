<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="title description">
  <title id="title">A welcoming library</title>
  <desc id="description">An open glowing book rests on a library table in front of colorful bookshelves and a starry window.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#1d3760"/>
      <stop offset="1" stop-color="#111d3b"/>
    </linearGradient>
    <linearGradient id="page" x2="0" y2="1">
      <stop stop-color="#fff3cc"/>
      <stop offset="1" stop-color="#e6b66c"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#ffdf8a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffdf8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <style>
    .wishing-star { opacity: 0; animation: wish 6s ease-in-out infinite; }
    @keyframes wish {
      0%, 12% { opacity: 0; transform: translate(0, 0); }
      20% { opacity: 1; }
      66% { opacity: 1; transform: translate(34px, 34px); }
      80%, 100% { opacity: 0; transform: translate(50px, 50px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wishing-star { opacity: .9; animation: none; }
    }
  </style>
  <rect width="540" height="340" rx="20" fill="url(#wall)"/>
  <rect x="24" y="28" width="154" height="174" rx="10" fill="#111a35" stroke="#7b9bd2" stroke-opacity=".55" stroke-width="3"/>
