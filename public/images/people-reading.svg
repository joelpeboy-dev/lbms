    <path d="M284 119c0-25 17-43 40-43 24 0 40 19 40 43v15c0 23-17 40-40 40-22 0-40-18-40-40z" fill="#efbd8c"/>
    <path d="M282 126c-6-36 13-65 44-65 25 0 43 19 40 51-12 0-23-7-30-18-12 15-29 24-54 25z" fill="#30283a"/>
    <path d="M291 122q9 8 18 3m31 0q10 5 18-3" fill="none" stroke="#59404a" stroke-linecap="round" stroke-width="3"/>
    <circle cx="302" cy="135" r="2" fill="#372d3b"/>
    <circle cx="342" cy="135" r="2" fill="#372d3b"/>
    <path d="M308 154q14 10 28 0" fill="none" stroke="#b25b5b" stroke-linecap="round" stroke-width="3"/>
    <path d="M314 183q9 11 18 0" fill="none" stroke="#f7d3a5" stroke-linecap="round" stroke-width="3"/>
