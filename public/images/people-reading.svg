<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="title description">
  <title id="title">A cozy evening of reading</title>
  <desc id="description">Two friends read together in a warmly lit library beneath a glowing book symbol, as a shooting star passes the window.</desc>
  <defs>
    <linearGradient id="room" x2="0" y2="1">
      <stop stop-color="#345b86"/>
      <stop offset=".52" stop-color="#203e68"/>
      <stop offset="1" stop-color="#111d3b"/>
    </linearGradient>
    <radialGradient id="warm-light">
      <stop stop-color="#ffd878" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="book-page" x2="0" y2="1">
      <stop stop-color="#fff8df"/>
      <stop offset="1" stop-color="#e9c98b"/>
    </linearGradient>
    <linearGradient id="left-shirt" x2="0" y2="1">
      <stop stop-color="#61b4c4"/>
      <stop offset="1" stop-color="#36768f"/>
    </linearGradient>
    <linearGradient id="right-shirt" x2="0" y2="1">
      <stop stop-color="#df8268"/>
      <stop offset="1" stop-color="#a64d54"/>
    </linearGradient>
    <linearGradient id="table" x2="0" y2="1">
      <stop stop-color="#bd8557"/>
      <stop offset="1" stop-color="#704333"/>
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <style>
    .reader {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: reading-bob 3.2s ease-in-out infinite;
    }
    .reader-right { animation-delay: -1.6s; }
    .shooting-star {
      opacity: 0;
      animation: star-crossing 7s ease-in-out infinite;
    }
    @keyframes reading-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes star-crossing {
      0%, 68%, 100% { opacity: 0; transform: translate(-26px, -20px); }
      70% { opacity: 1; }
      83% { opacity: 1; transform: translate(0, 0); }
      88% { opacity: 0; transform: translate(5px, 4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .reader, .shooting-star { animation: none; }
      .shooting-star { opacity: .85; }
    }
  </style>
  <rect width="540" height="340" rx="20" fill="url(#room)"/>
  <ellipse cx="270" cy="79" rx="103" ry="77" fill="url(#warm-light)" opacity=".48"/>
  <ellipse cx="270" cy="236" rx="204" ry="95" fill="url(#warm-light)" opacity=".2"/>
  <path d="M18 220h504" stroke="#9ebce0" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="107" cy="103" r="67" fill="#f8d99a" opacity=".12"/>
  <rect x="30" y="34" width="150" height="166" rx="13" fill="#132644" stroke="#a5c8ee" stroke-opacity=".72" stroke-width="4"/>
  <rect x="38" y="42" width="134" height="150" rx="7" fill="#1a3151" stroke="#8eb2dc" stroke-opacity=".28" stroke-width="2"/>
  <path d="M105 42v150M39 116h132" stroke="#8eb2dc" stroke-opacity=".5" stroke-width="4"/>
  <circle cx="72" cy="77" r="30" fill="url(#warm-light)" opacity=".5"/>
  <circle cx="69" cy="76" r="4" fill="#fff1bd"/>
  <circle cx="144" cy="91" r="3" fill="#fff1bd"/>
  <circle cx="63" cy="154" r="3" fill="#fff1bd"/>
  <circle cx="133" cy="61" r="2" fill="#fff1bd" opacity=".8"/>
  <path d="m85 137 2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#d5e8ff" opacity=".9"/>
  <g class="shooting-star" aria-label="A shooting star crossing the window">
    <path d="M118 52 150 80" fill="none" stroke="#ffe8a6" stroke-linecap="round" stroke-width="3" opacity=".8"/>
    <path d="m153 75 2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff5c9"/>
  </g>
  <g aria-label="Knowledge and ideas">
    <circle cx="270" cy="44" r="39" fill="#ffd878" opacity=".3" filter="url(#soft-glow)"/>
    <path d="M270 11v9m-28 6 7 6m49-6-7 6m-34-17 4 7m30-7-4 7" fill="none" stroke="#ffe7a0" stroke-linecap="round" stroke-width="3"/>
    <path d="M270 19c-13 0-22 9-22 21 0 8 4 14 10 18 3 2 4 5 4 8h16c0-3 1-6 4-8 6-4 10-10 10-18 0-12-9-21-22-21z" fill="#ffd878" stroke="#fff0b0" stroke-width="3"/>
    <path d="M259 64h22m-19 6h16" stroke="#e7b956" stroke-linecap="round" stroke-width="4"/>
    <path d="M270 39q-7-5-13-2v12q7-3 13 3 6-6 13-3V37q-6-3-13 2z" fill="#fff8df" stroke="#8b633c" stroke-linejoin="round" stroke-width="2"/>
    <path d="M270 40v12" stroke="#bd986a" stroke-width="2"/>
  </g>
  <rect x="360" y="55" width="153" height="166" rx="7" fill="#142845" stroke="#7194be" stroke-opacity=".7" stroke-width="3"/>
  <path d="M365 111h143m-143 53h143M365 216h143" stroke="#bd8a5b" stroke-width="8"/>
  <g stroke="#14233e" stroke-width="2">
    <path d="M378 70h20v38h-20z" fill="#e4866c"/>
    <path d="M402 77h25v31h-25z" fill="#78b9ad"/>
    <path d="M432 67h22v41h-22z" fill="#e4c36f"/>
    <path d="M459 75h38v33h-38z" fill="#a28fd0"/>
    <path d="M378 122h28v39h-28z" fill="#70a9d4"/>
    <path d="M411 127h22v34h-22z" fill="#dd896d"/>
    <path d="M438 119h30v42h-30z" fill="#76b09a"/>
    <path d="M473 125h25v36h-25z" fill="#dbbd77"/>
  </g>
  <g fill="none" stroke="#fff0c2" stroke-linecap="round" stroke-opacity=".48" stroke-width="1.5">
    <path d="M383 76v26m25 5V82m30-11v33m27-25v26m-82 23v26m37-28v25m35-30v27m23-20v20"/>
  </g>
  <path d="M374 178h125" stroke="#7194be" stroke-opacity=".34" stroke-width="2"/>
